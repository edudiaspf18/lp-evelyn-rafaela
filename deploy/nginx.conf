# /etc/nginx/sites-available/landing-evelyn  (ln -s para sites-enabled)
# Depois: sudo certbot --nginx -d evelynrafaelanutri.com.br -d www.evelynrafaelanutri.com.br
# O Certbot acrescenta o bloco 443 e o redirect 80 -> 443 sozinho.

# Rate limit por IP: 10 req/s, rajada 30 (a landing é estática; folga para carga de assets)
limit_req_zone $binary_remote_addr zone=lp_per_ip:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=lp_conn:10m;

# apex -> www (SITE_URL canônico usa www)
server {
    listen 80;
    listen [::]:80;
    server_name evelynrafaelanutri.com.br;
    return 301 https://www.evelynrafaelanutri.com.br$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name www.evelynrafaelanutri.com.br;

    server_tokens off;
    client_max_body_size 10k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    limit_req zone=lp_per_ip burst=30 nodelay;
    limit_conn lp_conn 30;
    limit_req_status 429;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # Assets versionados do Next: cache longo
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
